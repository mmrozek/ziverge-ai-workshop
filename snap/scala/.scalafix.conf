rules = [
  DisableSyntax
  OrganizeImports
  RemoveUnused
]

DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noReturns = true
  noWhileLoops = true
}

OrganizeImports {
  groupedImports = Explode
  removeUnused = true
}

RemoveUnused {
  // Import removal is handled by OrganizeImports (removeUnused = true above);
  // enabling it here too would have both rules fight over the same edits.
  imports = false
}
